[versions]
# Read by the app.revanced.patches plugin.
revanced-patcher = "22.0.1"
smali = "3.0.8"
ktlint = "1.8.0"
junit = "4.13.2"
org-json = "20260814"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
# Android's own org.json is a stub that throws in JVM unit tests.
org-json = { module = "org.json:json", version.ref = "org-json" }

[plugins]
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
